name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint (warning budget)
        run: npm run lint:ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit -p tsconfig.app.json

  test-frontend:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Vitest
        run: npx vitest run --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  test-e2e:
    name: E2E & Accessibility (Playwright)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/preview.log
          exit 1

      - name: Run Playwright
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  test-edge-functions:
    name: Edge Function Tests (Bun)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Run rateLimit tests
        run: |
          cd supabase/functions/_shared
          bun test rateLimit.test.ts

      - name: Run aiRouter tests
        run: |
          cd supabase/functions/_shared
          bun test aiRouter.test.ts

      - name: Run autonomous agent tests
        run: |
          cd supabase/functions/_shared
          bun test autonomousRisk.test.ts autonomousAgent.test.ts indicators.test.ts agentLoop.test.ts researchContext.test.ts

      - name: Run trading chat confirmation tests
        run: |
          cd supabase/functions/_shared
          bun test tradingChat.test.ts

      - name: Run HMAC tests
        run: |
          cd supabase/functions/bybit-trading
          bun test hmacSignature.test.ts

      - name: Run multi-exchange and B3 tests
        run: |
          cd supabase/functions/_shared
          bun test exchangeRegistry.test.ts exchangeAdapters.test.ts exchangeGateway.test.ts b3Signals.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-frontend, test-e2e, test-edge-functions]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit (production only, moderate+)
        run: npm run audit:ci

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  edge-functions:
    name: Edge Functions Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check Edge Functions syntax
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "Checking $f..."
            npx -y deno@latest check "$f" 2>&1 | head -20 || true
          done

      # As funções que podem mexer em ordens/pesquisa são bloqueantes. As demais
      # ainda têm erros de tipagem legados e seguem apenas informativas acima.
      # O checkout limpo não tem node_modules, necessário para o specifier npm:.
      - name: Install dependencies for strict Deno check
        run: npm ci --legacy-peer-deps

      - name: Strict check for trading, webhook and research functions
        run: npx -y deno@latest check supabase/functions/bybit-trading/index.ts supabase/functions/tradingview-webhook/index.ts supabase/functions/ai-market-analysis/index.ts

      - name: Verify config.toml
        run: |
          if [ -f supabase/config.toml ]; then
            echo "config.toml exists"
            cat supabase/config.toml
          else
            echo "config.toml missing"
            exit 1
          fi

  notify-failure:
    name: Notificar falha
    # Em PRs de fork o GITHUB_TOKEN é somente leitura; o alerta cobre pushes em main.
    if: ${{ failure() && github.event_name == 'push' }}
    needs: [lint-and-typecheck, test-frontend, test-e2e, test-edge-functions, build, audit, secret-scan, edge-functions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Abrir/comentar issue de alerta
        uses: actions/github-script@v8
        with:
          script: |
            const title = '[Alerta] CI falhou';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Falha detectada no CI.',
              '',
              `- Workflow: ${context.workflow}`,
              `- Commit: ${context.sha}`,
              `- Run: ${runUrl}`,
              `- Disparo: ${new Date().toISOString()}`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const found = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = found.data.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true